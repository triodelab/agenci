packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  lightningcss: true
  msgpackr-extract: true
  prisma: true
  '@clerk/shared': true
  '@sentry/cli': false
  '@swc/core': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  esbuild: true
  protobufjs: true
  sharp: true
  utf-8-validate: true
catalog:
  "@orpc/client": ^1.14.12
  "@orpc/openapi": ^1.14.12
  "@orpc/server": ^1.14.12
  "@orpc/zod": ^1.14.12
  "@types/bun": ^1.4.2
  better-auth: 1.7.1
  elysia: ^1.4.29
  hono: ^4.13.8
  "@types/node": ^20.19.25
  convex: ^1.39.1
  dotenv: ^17.2.3
  typescript: ^5
  zod: ^4.1.13
# Én React (og React-typer) i hele workspacen, samme versjoner som main: med to
# kopier får apps/web og packages/ui hver sin react-hook-form/radix osv., og
# skjemaene deler ikke kontekst.
overrides:
  react: 19.0.0
  react-dom: 19.0.0
  "@types/react": 19.0.10
  "@types/react-dom": 19.0.4
# agent-playground importerer ai uten å ha den som avhengighet, og fikk derfor
# den heistede kopien — nå ai v5 (fra apps/server). Gi den sin egen ai v4, som på main.
packageExtensions:
  "@convex-dev/agent-playground@0.0.17":
    dependencies:
      ai: ^4.3.19
