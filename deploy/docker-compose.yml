name: agenci-prod

# Production stack on the VPS (app.agenci.no).
#   app       Caddy: HTTPS, serves the dashboard, proxies /rpc /api /ws → server
#   server    Hono API (Bun) — Better Auth, oRPC, Inngest functions, Mastra
#   inngest   self-hosted Inngest (background jobs: crawl, ingest)
#   postgres  pgvector — app data, auth, Mastra memory + embeddings
#   minio     uploaded source files
# Only Caddy publishes ports; everything else stays on the private network.
#
# Secrets live in deploy/.env (see deploy/.env.example), never in git.
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Temporary password gate on app.agenci.no (see Caddyfile).
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/agenci
      INNGEST_DEV: "0"
      INNGEST_BASE_URL: http://inngest:8288
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  inngest:
    image: inngest/inngest:latest
    command: >
      inngest start
      --sdk-url http://server:3003/api/inngest
      --event-key ${INNGEST_EVENT_KEY}
      --signing-key ${INNGEST_SIGNING_KEY}
      --sqlite-dir /data
    volumes:
      - inngest-data:/data
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: agenci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenci"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-agenci-bucket}
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  inngest-data:
  postgres-data:
  minio-data:
